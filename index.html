<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task </title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0b0e14',
          panel: '#12161f',
          panel2: '#171c28',
          border2: '#232a38',
          accent: '#6c5ce7',
          accent2: '#00d3a7',
          danger: '#ff5b6a',
          muted: '#7d8496',
        }
      }
    }
  }
</script>
<style>
  input[type="range"]{ accent-color: #6c5ce7; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#232a38; border-radius:8px; }
  @keyframes slideIn{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);} }
  .task-anim{ animation: slideIn .25s ease; }
</style>
</head>
<body class="bg-bg text-slate-100 min-h-screen font-sans">
<div class="flex flex-col lg:flex-row min-h-screen">

  <!-- SIDEBAR -->
  <div class="w-full lg:w-[380px] lg:min-w-[320px] bg-panel border-b lg:border-b-0 lg:border-r border-border2 p-5 flex flex-col">
    <div class="flex items-center gap-2 text-xl font-bold mb-5">
      <span class="w-2.5 h-2.5 rounded-full bg-accent2 shadow-[0_0_10px_#00d3a7]"></span>
      Task Dashboard
    </div>

    <input id="taskInput" type="text" placeholder="Add a task..." maxlength="120"
      class="w-full mb-2 px-3.5 py-3 rounded-xl bg-panel2 border border-border2 text-slate-100 placeholder-muted outline-none focus:border-accent">

    <div class="flex gap-2 mb-3">
      <select id="priorityInput" class="flex-1 px-2 rounded-xl bg-panel2 border border-border2 text-slate-100 text-sm">
        <option value="normal">Normal priority</option>
        <option value="high">High priority</option>
        <option value="low">Low priority</option>
      </select>
      <button onclick="addTask()" class="px-4 rounded-xl bg-accent hover:bg-[#5a4bd6] active:scale-95 transition text-white text-xl font-bold">+</button>
    </div>

    <div class="flex gap-1.5 mb-4">
      <button data-filter="all" onclick="setFilter('all')" class="filter-btn flex-1 py-2 rounded-lg text-xs border border-border2 bg-panel2 text-muted">All</button>
      <button data-filter="active" onclick="setFilter('active')" class="filter-btn flex-1 py-2 rounded-lg text-xs border border-border2 bg-panel2 text-muted">Active</button>
      <button data-filter="done" onclick="setFilter('done')" class="filter-btn flex-1 py-2 rounded-lg text-xs border border-border2 bg-panel2 text-muted">Done</button>
    </div>

    <ul id="taskList" class="flex flex-col gap-2 overflow-y-auto flex-1 max-h-[50vh] lg:max-h-none"></ul>

    <button onclick="clearCompleted()" class="mt-3 py-2 rounded-lg border border-border2 text-muted text-xs hover:border-danger hover:text-danger transition">
      Clear completed
    </button>
  </div>

  <!-- MAIN -->
  <div class="flex-1 p-6 sm:p-9 flex flex-col gap-7 overflow-y-auto">
    <div>
      <h1 class="text-2xl font-bold mb-1">Today's Overview</h1>
      <div id="today" class="text-muted text-sm"></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-panel border border-border2 rounded-2xl p-5">
        <div class="text-muted text-xs mb-1.5">Total tasks</div>
        <div id="statTotal" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-panel border border-border2 rounded-2xl p-5">
        <div class="text-muted text-xs mb-1.5">Completed</div>
        <div id="statDone" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-panel border border-border2 rounded-2xl p-5">
        <div class="text-muted text-xs mb-1.5">Overall progress</div>
        <div id="statOverall" class="text-2xl font-bold text-accent2">0%</div>
      </div>
    </div>

    <div class="bg-panel border border-border2 rounded-2xl p-6">
      <h3 class="font-semibold mb-1">Overall Progress</h3>
      <p class="text-muted text-xs mb-4">Average of each task's individual progress below.</p>
      <div class="w-full h-6 bg-panel2 border border-border2 rounded-full overflow-hidden">
        <div id="overallBar" class="h-full bg-gradient-to-r from-accent to-accent2 flex items-center justify-end pr-2.5 text-[11px] font-bold text-white transition-all duration-300" style="width:0%">0%</div>
      </div>
    </div>

    <div>
      <h3 class="font-semibold mb-3">Task Progress</h3>
      <div id="taskProgressList" class="flex flex-col gap-4"></div>
    </div>
  </div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem('dailyTasks') || '[]');
// migrate old tasks: ensure progress field exists
tasks.forEach(t => { if (typeof t.progress !== 'number') t.progress = t.done ? 100 : 0; });

let filter = 'all';

document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });

function save(){
  localStorage.setItem('dailyTasks', JSON.stringify(tasks));
  render();
}

function addTask(){
  const input = document.getElementById('taskInput');
  const priority = document.getElementById('priorityInput').value;
  const text = input.value.trim();
  if(!text) return;
  tasks.unshift({ id: Date.now(), text, done:false, priority, progress:0 });
  input.value='';
  save();
}
document.getElementById('taskInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') addTask();
});

function toggleTask(id){
  const t = tasks.find(t=>t.id===id);
  if(t){
    t.done = !t.done;
    t.progress = t.done ? 100 : (t.progress === 100 ? 0 : t.progress);
    save();
  }
}
function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  save();
}
function clearCompleted(){
  tasks = tasks.filter(t=>!t.done);
  save();
}
function setFilter(f){
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    const active = b.dataset.filter === f;
    b.classList.toggle('bg-accent', active);
    b.classList.toggle('text-white', active);
    b.classList.toggle('border-accent', active);
    b.classList.toggle('bg-panel2', !active);
    b.classList.toggle('text-muted', !active);
  });
  render();
}

function setTaskProgress(id, val){
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  const p = parseInt(val, 10);
  t.progress = p;
  t.done = p === 100;
  save();
}

function priorityDot(priority){
  if(priority === 'high') return 'bg-danger';
  if(priority === 'low') return 'bg-accent2';
  return 'bg-accent';
}

function render(){
  // --- sidebar list ---
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  let visible = tasks;
  if(filter==='active') visible = tasks.filter(t=>!t.done);
  if(filter==='done') visible = tasks.filter(t=>t.done);

  if(visible.length === 0){
    list.innerHTML = '<li class="text-center text-muted text-sm py-8">No tasks here 🌿</li>';
  }

  visible.forEach(t=>{
    const li = document.createElement('li');
    li.className = 'task-anim flex items-center gap-2.5 bg-panel2 border border-border2 rounded-xl px-3 py-2.5' + (t.done ? ' opacity-45' : '');
    li.innerHTML = `
      <div onclick="toggleTask(${t.id})"
        class="w-5 h-5 rounded-full border-2 border-accent flex items-center justify-center cursor-pointer shrink-0 ${t.done ? 'bg-accent2 border-accent2' : ''}">
        ${t.done ? '<span class="text-bg text-xs font-bold">✓</span>' : ''}
      </div>
      <span class="w-2 h-2 rounded-full shrink-0 ${priorityDot(t.priority)}"></span>
      <div class="flex-1 text-sm break-words ${t.done ? 'line-through' : ''}">${escapeHtml(t.text)}</div>
      <span class="text-xs text-muted w-9 text-right">${t.progress}%</span>
      <button onclick="deleteTask(${t.id})" class="text-muted hover:text-danger transition text-base">🗑</button>
    `;
    list.appendChild(li);
  });

  // --- stat cards ---
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const overall = total === 0 ? 0 : Math.round(tasks.reduce((s,t)=>s+t.progress,0) / total);

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statOverall').textContent = overall + '%';

  const bar = document.getElementById('overallBar');
  bar.style.width = overall + '%';
  bar.textContent = overall + '%';

  // --- individual task progress sliders ---
  const progWrap = document.getElementById('taskProgressList');
  progWrap.innerHTML = '';
  if(tasks.length === 0){
    progWrap.innerHTML = '<div class="text-muted text-sm">Add a task to start tracking its progress.</div>';
  }
  tasks.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'bg-panel border border-border2 rounded-2xl p-5';
    card.innerHTML = `
      <div class="flex items-center justify-between mb-2 gap-3">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full shrink-0 ${priorityDot(t.priority)}"></span>
          <span class="text-sm font-medium truncate ${t.done ? 'line-through text-muted' : ''}">${escapeHtml(t.text)}</span>
        </div>
        <span class="text-sm font-bold text-accent2 shrink-0">${t.progress}%</span>
      </div>
      <div class="w-full h-3 bg-panel2 border border-border2 rounded-full overflow-hidden mb-3">
        <div class="h-full bg-gradient-to-r from-accent to-accent2 transition-all duration-300" style="width:${t.progress}%"></div>
      </div>
      <input type="range" min="0" max="100" step="5" value="${t.progress}"
        oninput="setTaskProgress(${t.id}, this.value)" class="w-full">
      <div class="flex flex-wrap gap-1.5 mt-3">
        ${[0,25,50,75,100].map(p => `
          <button onclick="setTaskProgress(${t.id}, ${p})"
            class="px-2.5 py-1 rounded-md text-xs border border-border2 ${t.progress===p ? 'bg-accent text-white border-accent' : 'bg-panel2 text-muted hover:text-slate-100'}">
            ${p}%
          </button>`).join('')}
      </div>
    `;
    progWrap.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

setFilter('all');
render();
</script>
</body>
</html>
